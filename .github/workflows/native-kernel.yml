name: Native v7 kernel parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  native-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: tests/ground-cite.test.js cites a real, pinned
          # commit (bb97e4b, an ancestor of main) through `git cat-file` /
          # `git show`; checkout's default depth-1 clone does not hold it.
          fetch-depth: 0
      # The conductor test (native/tests/conductor.test.js) exercises the
      # machine door through penelope's durable retention seam, imported as a
      # sibling (../../../penelope from native/tests). Check it out next to
      # this repo so that integration test runs for real instead of erroring
      # on a missing module. penelope is public; the default token may clone it.
      - name: Check out the sibling penelope (the machine door retains through it)
        run: git clone --depth 1 https://github.com/scores-patch-points/penelope.git "${GITHUB_WORKSPACE}/../penelope"
      # The rules of reading are Relate's: every prior (pos · frame · role-config
      # · morph-cues · case-marking · …) lives at the workspace's janus/priors and
      # native/the-fold/priors-home.js resolves it there (../../../janus/priors),
      # as DATA, never a module import. Without the sibling, langid and relation
      # reading find no priors and return null — a typed gap, but a red gate.
      # Check janus out next to this repo, exactly as penelope is above. janus is public.
      - name: Check out the sibling janus (the one home for the priors)
        run: git clone --depth 1 https://github.com/scores-patch-points/janus.git "${GITHUB_WORKSPACE}/../janus"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies for the real reasoning gate
        run: npm ci
      - name: Install native adapter dependencies
        working-directory: native
        run: npm ci
      # NOTE: native/eval/the-fold (and its lock-pinned pyodide runtime) was
      # removed in the 2026-10-04 canonical cut (c1b3986). postprocess.mjs
      # resolves pyodide by file URL from ./native/eval/the-fold/node_modules
      # OR ./node_modules/pyodide — neither is declared by any package.json
      # now, and no test asserts a live pyodide, so no install step is needed;
      # the Python-reading organs degrade to their named "pyodide unavailable"
      # path. Re-add a lock-pinned install here only if a pyodide dependency is
      # reintroduced.
      # The notebook, structure-swarm and holodeck end-to-end tests run real
      # python3 (organs/er7py, the notebook cells) with numpy and matplotlib.
      # The runner's own python has neither, so those tests failed with
      # ModuleNotFoundError. Versions and the measurement: native/requirements-ci.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Python packages the native tests import
        run: python -m pip install -r native/requirements-ci.txt
      # The screen pipeline (native/conformance/screen-pipeline.test.mjs) decodes screenshots with ffmpeg and reads their
      # text with tesseract. Without them those tests SKIP with a named reason — they do not pass — so the runner gets both.
      - name: Install the local binaries the screen pipeline reads with
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Run native Fold parity gate
        working-directory: native
        run: npm test
      - name: Run organ gate
        working-directory: native
        run: npm run test:organs
      - name: Run Heimdall gate
        working-directory: native
        run: npm run test:heimdall
      - name: Run root acceptance gate
        run: npm test
      - name: Run coding loop and void gates
        run: npm run test:code
